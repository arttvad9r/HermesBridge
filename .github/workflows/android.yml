name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcp_adapter/pyproject.toml

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate host, release, and workflow scripts
        run: |
          bash -n host/run-local-host.sh
          bash -n host/install-local.sh
          bash -n release/build-signed-apk.sh
          bash -n release/verify-reproducible-unsigned-apk.sh
          bash -n ci/verify-actions-pinned.sh
          ci/verify-actions-pinned.sh

      - name: Reject partial release signing configuration
        run: |
          log="$RUNNER_TEMP/partial-release-signing.log"
          if TYPED_DROID_SIGNING_STORE_FILE="$RUNNER_TEMP/incomplete.jks" \
            ./gradlew --no-daemon :app:tasks >"$log" 2>&1; then
            cat "$log"
            echo "Gradle accepted a partial release-signing configuration." >&2
            exit 1
          fi
          grep -Fq "Release signing is partially configured" "$log" || {
            cat "$log"
            echo "Gradle failed for an unexpected reason while testing partial signing configuration." >&2
            exit 1
          }

      - name: Unit tests
        run: ./gradlew --no-daemon :protocol:test :relay:test :app:testDebugUnitTest

      - name: Smoke local Bridge Host
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/typeddroid-config"
          export XDG_STATE_HOME="$RUNNER_TEMP/typeddroid-state"
          export XDG_DATA_HOME="$RUNNER_TEMP/typeddroid-data"
          export PORT=18080
          ./host/run-local-host.sh >"$RUNNER_TEMP/bridge-host.log" 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health | grep -qx ok; then
              break
            fi
            if ! kill -0 "$host_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/bridge-host.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health | grep -qx ok
          test "$(stat -c '%a' "$XDG_CONFIG_HOME/typeddroid/admin-token")" = 600

      - name: Test generic MCP adapter
        run: |
          python -m pip install ./mcp_adapter
          python -m unittest discover -s mcp_adapter/tests -v

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug :e2e-fixture:lintDebug

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug :e2e-fixture:assembleDebug

      - name: Verify physical E2E fixture APK policy
        run: |
          apk=e2e-fixture/build/outputs/apk/debug/e2e-fixture-debug.apk
          test -s "$apk"

          apkanalyzer_bin="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer_bin" ]; then
            apkanalyzer_bin="$(find "${ANDROID_HOME:?}/cmdline-tools" -type f -name apkanalyzer -perm -u+x -print -quit)"
          fi
          test -x "$apkanalyzer_bin"

          test "$("$apkanalyzer_bin" manifest application-id "$apk")" = \
            "io.github.arttvad9r.typeddroid.fixture"
          permissions="$("$apkanalyzer_bin" manifest permissions "$apk")"
          test "$permissions" = "android.permission.CAMERA"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typed-droid-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload physical E2E fixture APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typed-droid-e2e-fixture
          path: e2e-fixture/build/outputs/apk/debug/e2e-fixture-debug.apk

      - name: Verify signed release path
        run: |
          test_keystore="$RUNNER_TEMP/typed-droid-ci-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$test_keystore" \
            -storepass ci-test-only \
            -keypass ci-test-only \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TypedDroid CI,O=TypedDroid,C=US"
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$apksigner_path"
          export TYPED_DROID_APKSIGNER="$apksigner_path"
          export TYPED_DROID_SIGNING_STORE_FILE="$test_keystore"
          export TYPED_DROID_SIGNING_STORE_PASSWORD=ci-test-only
          export TYPED_DROID_SIGNING_KEY_ALIAS=ci-release
          export TYPED_DROID_SIGNING_KEY_PASSWORD=ci-test-only
          release/build-signed-apk.sh

      - name: Verify reproducible unsigned release APK
        run: |
          set -o pipefail
          release_log="$RUNNER_TEMP/reproducible-release-build.log"
          release/verify-reproducible-unsigned-apk.sh 2>&1 | tee "$release_log"
          if grep -Fq "R8: An error occurred when parsing kotlin metadata" "$release_log"; then
            echo "R8 is not compatible with the project's Kotlin metadata." >&2
            exit 1
          fi

      - name: Verify minified privileged entry points
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          mapping=app/build/outputs/mapping/release/mapping.txt
          embedded_main=io.github.arttvad9r.typeddroid.EmbeddedPrivilegedMain

          test -s "$apk"
          test -s "$mapping"

          apkanalyzer_bin="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer_bin" ]; then
            apkanalyzer_bin="$(find "${ANDROID_HOME:?}/cmdline-tools" -type f -name apkanalyzer -perm -u+x -print -quit)"
          fi
          test -x "$apkanalyzer_bin"

          "$apkanalyzer_bin" dex code \
            --class "$embedded_main" \
            --method 'main([Ljava/lang/String;)V' \
            "$apk" >/dev/null
          grep -Fqx "$embedded_main -> $embedded_main:" "$mapping"

      - name: Build Bridge Host runtime distribution
        run: |
          ./gradlew --no-daemon :relay:distTar
          relay_tar=$(find relay/build/distributions -maxdepth 1 -type f -name '*.tar' -print -quit)
          test -n "$relay_tar"
          tar -tf "$relay_tar" | grep -qx 'relay/bin/relay'

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typed-droid-release-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Upload relay distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typed-droid-host-runtime
          path: |
            relay/build/distributions/*.tar
            host/**
            adapters/**
