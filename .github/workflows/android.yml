name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hermes_mcp/pyproject.toml

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install-relay.sh
          bash deploy/install-relay.sh --help >/dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon :protocol:test :relay:test :app:testDebugUnitTest

      - name: Test Hermes MCP adapter
        run: |
          python -m pip install ./hermes_mcp
          python -m unittest discover -s hermes_mcp/tests -v

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build minified release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Build relay distribution
        run: |
          ./gradlew --no-daemon :relay:distTar
          relay_tar=$(find relay/build/distributions -maxdepth 1 -type f -name '*.tar' -print -quit)
          test -n "$relay_tar"
          tar -tf "$relay_tar" | grep -qx 'relay/bin/relay'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bridge-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload relay distribution
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bridge-relay
          path: |
            relay/build/distributions/*.tar
            deploy/**
