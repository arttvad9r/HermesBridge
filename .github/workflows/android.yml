name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hermes_mcp/pyproject.toml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Generate pinned Gradle Wrapper once
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: |
          gradle --no-daemon wrapper \
            --gradle-version 8.14.4 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "build: add pinned Gradle wrapper"
          git push origin HEAD:main

      - name: Unit tests
        run: ./gradlew --no-daemon :protocol:test :relay:test :app:testDebugUnitTest

      - name: Test Hermes MCP adapter
        run: |
          python -m pip install ./hermes_mcp
          python -m unittest discover -s hermes_mcp/tests -v

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build relay distribution
        run: ./gradlew --no-daemon :relay:distTar

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload relay distribution
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bridge-relay
          path: relay/build/distributions/*.tar
