name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hermes_mcp/pyproject.toml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      - name: Unit tests
        run: gradle --no-daemon :protocol:test :relay:test :app:testDebugUnitTest

      - name: Test Hermes MCP adapter
        run: |
          python -m pip install ./hermes_mcp
          python -m unittest discover -s hermes_mcp/tests -v

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build relay distribution
        run: gradle --no-daemon :relay:distTar

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload relay distribution
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bridge-relay
          path: relay/build/distributions/*.tar
