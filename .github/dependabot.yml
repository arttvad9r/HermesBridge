version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      ktor:
        applies-to: "version-updates"
        patterns:
          - "io.ktor:*"
        update-types:
          - "minor"
          - "patch"
      kotlinx-serialization:
        applies-to: "version-updates"
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-serialization-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/mcp_adapter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
